server:
  port: 8094

# Configuración de base de datos (se puede sobrescribir desde variables de entorno)
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL_AUTH:jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:usuario}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  jwt:
    secret: your-256-bit-secret-key-for-jwt-token-generation-must-be-at-least-256-bits-long-for-hs256-algorithm
    expiration: 86400000
    refresh-expiration: 604800000

# Eureka Client
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# Logging
logging:
  level:
    root: INFO
    com.irojas.microservices: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
  file:
    name: logs/auth-microservice.log
    max-size: 10MB
    max-history: 30

# JWT Configuration (puede venir del Config Server o definirse aquí)
jwt:
  secret: your-256-bit-secret-key-for-jwt-token-generation-must-be-at-least-256-bits-long-for-hs256-algorithm
  expiration: 86400000
  refresh-expiration: 604800000

# Actuator & Prometheus
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

# Swagger/OpenAPI
springdoc:
  openapi:
    info:
      title: Auth Microservice API
      description: Servicio de autenticación y autorización con JWT
      version: 1.0.0
      contact:
        name: Equipo de Soporte
        email: support@mail.com
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html