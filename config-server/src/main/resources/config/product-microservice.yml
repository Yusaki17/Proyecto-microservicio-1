spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
    hikari:
      auto-commit: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.OracleDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect   # ← AGREGAR
        connection:
          autocommit: true  # ← AGREGAR

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

logging:
  level:
    root: INFO
    com.rojas.microservices: WARN
  pattern:
    console: '%d{yyyy-MM-dd HH:mm-ss} [%thread] %-5level %logger{36} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm-ss} [%thread] %-5level %logger{36} - %msg%n'
  file:
    name: logs/product-microservice.log
    max-size: 10MB
    max-history: 30

server:
  port: 8092

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  openapi:
    info:
      title: Cart Microservice API
      description: Service for managing shopping carts in the e-commerce application.
      version: 1.0.0
      contact:
        name: Equipo de Soporte
        email: support@mail.com

# JWT Configuration (DEBE SER LA MISMA CLAVE QUE EN AUTH-MICROSERVICE)
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-jwt-token-generation-must-be-at-least-256-bits-long-for-hs256-algorithm}