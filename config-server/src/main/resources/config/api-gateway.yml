spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: customer-microservice
              uri: lb://customer-microservice
              predicates:
                - Path=/api/v1/customers/**
              filters:
                - PreserveHostHeader
                - RewritePath=/api/v1/customers/v3/api-docs, /v3/api-docs
            - id: product-microservice
              uri: lb://product-microservice
              predicates:
                - Path=/api/v1/products/**,/api/v1/categories/**
              filters:
                - PreserveHostHeader
                - RewritePath=/api/v1/products/v3/api-docs, /v3/api-docs
            - id: cart-microservice
              uri: lb://cart-microservice
              predicates:
                - Path=/api/v1/*/cart/**
            - id: cart-microservice-swagger
              uri: lb://cart-microservice
              predicates:
                - Path=/api/v1/cart/v3/api-docs
              filters:
                - PreserveHostHeader
                - RewritePath=/api/v1/cart/v3/api-docs, /v3/api-docs
            - id: auth-microservice-public
              uri: lb://auth-microservice
              predicates:
                - Path=/api/v1/auth/**  # ← Captura TODAS las rutas de /api/v1/auth/
              filters:
                - PreserveHostHeader
              metadata:
                secure: false
            - id: payment-microservice
              uri: lb://payment-microservice
              predicates:
                - Path=/api/v1/payments/**
              filters:
                - PreserveHostHeader
            - id: category-microservice-swagger
              uri: lb://product-microservice
              predicates:
                - Path=/api/v1/categories/v3/api-docs
              filters:
                - PreserveHostHeader
                - RewritePath=/api/v1/categories/v3/api-docs, /v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    org.springframework.http.server.reactive: DEBUG
    org.springframework.web.reactive: DEBUG
    reactor.netty: DEBUG

server:
  port: 8222

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    urls:
      - name: Customer Microservice
        url: /api/v1/customers/v3/api-docs
      - name: Product Microservice
        url: /api/v1/products/v3/api-docs
      - name: Cart Microservice
        url: /api/v1/cart/v3/api-docs
      - name: Auth Microservice
        url: /api/v1/auth/v3/api-docs
      - name: Payemnt Microservice
        url: /api/v1/payments/v3/api-docs
      - name: Category Microservice  # ← AGREGAR ESTO
        url: /api/v1/categories/v3/api-docs

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-jwt-token-generation-must-be-at-least-256-bits-long-for-hs256-algorithm}

security:
  filter:
    exclude-paths:
      - /api/v1/auth/login
      - /api/v1/auth/register
      - /api/v1/auth/refresh-token
      - /v3/api-docs/**
      - /swagger-ui/**
      - /actuator/**